# Render.com deployment configuration
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: dss-healthcare-scheduler
    runtime: node
    region: singapore  # Terdekat dengan Indonesia
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false  # Set manual di dashboard Render
      - key: JWT_SECRET
        generateValue: true  # Auto-generate random secret
      - key: FRONTEND_URL
        sync: false  # Set manual setelah deploy frontend
